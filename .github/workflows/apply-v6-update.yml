name: Apply CBT v6 update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v6-update.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staged payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .update_payload/part*.b64
          sha256sum .update_payload/part*.b64
          for f in .update_payload/part*.b64; do
            echo "INVALID-CHARS $f: $(LC_ALL=C tr -d 'A-Za-z0-9+/=' < "$f" | wc -c)"
          done

      - name: Reconstruct and apply latest app
        shell: bash
        run: |
          set -euo pipefail
          cat .update_payload/part*.b64 | base64 -d > /tmp/cbt-v6.zip
          unzip -t /tmp/cbt-v6.zip
          rm -rf /tmp/cbt-v6
          mkdir -p /tmp/cbt-v6
          unzip -q -o /tmp/cbt-v6.zip -d /tmp/cbt-v6
          cp /tmp/cbt-v6/index.html ./index.html
          cp /tmp/cbt-v6/style.css ./style.css
          cp /tmp/cbt-v6/app.js ./app.js
          cp /tmp/cbt-v6/README.md ./README.md
          cp /tmp/cbt-v6/sample_questions_format.txt ./sample_questions_format.txt
          cp /tmp/cbt-v6/QUESTION_AUTHORING_RULES.md ./QUESTION_AUTHORING_RULES.md
          rm -rf .update_payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update CBT Mock Test to v6 latest"
          git push
